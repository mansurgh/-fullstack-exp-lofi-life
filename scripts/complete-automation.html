        async function fetchSurahTexts(surahNumber) {
            const apiUrl = `https://api.alquran.cloud/v1/surah/${surahNumber}/editions/quran-uthmani,en.sahih`;
            
            try {
                const response = await fetch(apiUrl);
                
                if (!response.ok) {
                    throw new Error(`HTTP ${response.status}`);
                }
                
                const data = await response.json();
                
                if (!data.data || data.data.length < 2) {
                    throw new Error('Неполные данные от API');
                }
                
                const arabicVerses = data.data[0].ayahs;
                const englishVerses = data.data[1].ayahs;
                
                const verses = [];
                for (let i = 0; i < arabicVerses.length; i++) {
                    const arabic = arabicVerses[i].text || '';
                    const translation = englishVerses[i]?.text || '';
                    
                    verses.push({
                        arabic: arabic.trim(),
                        translation: translation.trim()
                    });
                }
                
                return verses;
                
            } catch (error) {
                console.error(`Ошибка при загрузке суры ${surahNumber}:`, error);
                return null;
            }
        }
        
        function generateSurahCode(surahNumber, verses, surahInfo) {
            const info = surahInfo[surahNumber];
            
            let code = `// Сура ${surahNumber} - ${info.name} (${verses.length} аятов)\n`;
            code += `export const surah${surahNumber}: SurahData = {\n`;
            code += `  number: ${surahNumber},\n`;
            code += `  name: "${info.name}",\n`;
            code += `  englishName: "${info.englishName}",\n`;
            code += `  verses: ${verses.length},\n`;
            code += `  texts: [\n`;
            
            for (let i = 0; i < verses.length; i++) {
                const arabic = verses[i].arabic.replace(/"/g, '\\"');
                const translation = verses[i].translation.replace(/"/g, '\\"');
                
                code += `    { arabic: "${arabic}", translation: "${translation}" }`;
                if (i < verses.length - 1) {
                    code += ',';
                }
                code += '\n';
            }
            
            code += `  ]\n`;
            code += `};\n\n`;
            
            return code;
        }
        
        async function startAutomation() {
            if (isRunning) return;
            
            isRunning = true;
            loadedCount = 0;
            errorCount = 0;
            
            document.getElementById('status').innerHTML = '🚀 Запуск полной автоматизации...';
            document.getElementById('status').className = 'status info';
            
            let allCode = `// Полные тексты всех 114 сур Корана
// Арабские тексты и английские переводы
// Автоматически сгенерировано: ${new Date().toISOString()}

export interface SurahText {
  arabic: string;
  translation: string;
}

export interface SurahData {
  number: number;
  name: string;
  englishName: string;
  verses: number;
  texts: SurahText[];
}

`;

            // Загружаем ВСЕ суры 1-114
            for (let surahNum = 1; surahNum <= 114; surahNum++) {
                if (!isRunning) break;
                
                document.getElementById('status').innerHTML = `🔄 Загружаем суру ${surahNum}/114...`;
                document.getElementById('status').className = 'status info';
                
                const verses = await fetchSurahTexts(surahNum);
                
                if (verses) {
                    const surahCode = generateSurahCode(surahNum, verses, surahInfo);
                    allCode += surahCode;
                    loadedCount++;
                } else {
                    errorCount++;
                }
                
                // Обновляем прогресс
                const progress = (surahNum / 114) * 100;
                document.getElementById('progressBar').style.width = progress + '%';
                document.getElementById('loadedSurahs').textContent = loadedCount;
                document.getElementById('errorSurahs').textContent = errorCount;
                
                // Пауза между запросами
                await new Promise(resolve => setTimeout(resolve, 500));
            }
            
            if (isRunning) {
                document.getElementById('output').value = allCode;
                document.getElementById('status').innerHTML = `🎉 Готово! Загружено ${loadedCount} сур, ошибок: ${errorCount}`;
                document.getElementById('status').className = 'status success';
            }
            
            isRunning = false;
        }
        
        function stopAutomation() {
            isRunning = false;
            document.getElementById('status').innerHTML = '⏹️ Остановлено пользователем';
            document.getElementById('status').className = 'status error';
        }
        
        function copyToClipboard() {
            document.getElementById('output').select();
            document.execCommand('copy');
            alert('Код скопирован в буфер обмена!');
        }
        
        function downloadFile() {
            const content = document.getElementById('output').value;
            if (!content) {
                alert('Сначала загрузите данные!');
                return;
            }
            
            const blob = new Blob([content], { type: 'text/plain' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = 'quranTexts.ts';
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
        }

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quran Data Extractor</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        .container { max-width: 1200px; margin: 0 auto; }
        button { padding: 10px 20px; margin: 10px; font-size: 16px; }
        .output { background: #f5f5f5; padding: 20px; margin: 20px 0; border-radius: 5px; }
        .verse { margin: 5px 0; padding: 5px; border-left: 3px solid #007acc; }
        .arabic { font-size: 18px; direction: rtl; text-align: right; }
        .translation { font-size: 14px; color: #666; }
        textarea { width: 100%; height: 300px; font-family: monospace; }
    </style>
</head>
<body>
    <div class="container">
        <h1>📖 Quran Data Extractor</h1>
        <p>Этот инструмент поможет извлечь полные тексты сур Корана через API.</p>
        
        <div>
            <label for="surahNumber">Номер суры (1-114):</label>
            <input type="number" id="surahNumber" value="2" min="1" max="114">
            <button onclick="fetchSurah()">Получить суру</button>
            <button onclick="fetchAllSurahs()">Получить все суры 1-10</button>
        </div>
        
        <div id="status"></div>
        
        <div class="output">
            <h3>Результат:</h3>
            <textarea id="output" placeholder="Здесь появится код для вставки в quranTexts.ts"></textarea>
            <button onclick="copyToClipboard()">Копировать код</button>
        </div>
        
        <div id="verses"></div>
    </div>

    <script>
        const statusDiv = document.getElementById('status');
        const outputTextarea = document.getElementById('output');
        const versesDiv = document.getElementById('verses');
        
        const surahInfo = {
            1: { name: "الفاتحة", englishName: "Al-Fatihah", verses: 7 },
            2: { name: "البقرة", englishName: "Al-Baqarah", verses: 286 },
            3: { name: "آل عمران", englishName: "Ali 'Imran", verses: 200 },
            4: { name: "النساء", englishName: "An-Nisa", verses: 176 },
            5: { name: "المائدة", englishName: "Al-Ma'idah", verses: 120 },
            6: { name: "الأنعام", englishName: "Al-An'am", verses: 165 },
            7: { name: "الأعراف", englishName: "Al-A'raf", verses: 206 },
            8: { name: "الأنفال", englishName: "Al-Anfal", verses: 75 },
            9: { name: "التوبة", englishName: "At-Tawbah", verses: 129 },
            10: { name: "يونس", englishName: "Yunus", verses: 109 }
        };
        
        async function fetchSurah() {
            const surahNumber = document.getElementById('surahNumber').value;
            if (!surahNumber || surahNumber < 1 || surahNumber > 114) {
                alert('Введите корректный номер суры (1-114)');
                return;
            }
            
            statusDiv.innerHTML = `🔄 Загружаем суру ${surahNumber}...`;
            
            try {
                const response = await fetch(`https://api.alquran.cloud/v1/surah/${surahNumber}/editions/quran-uthmani,en.sahih`);
                
                if (!response.ok) {
                    throw new Error(`HTTP ${response.status}`);
                }
                
                const data = await response.json();
                
                if (!data.data || data.data.length < 2) {
                    throw new Error('Неполные данные от API');
                }
                
                const arabicVerses = data.data[0].ayahs;
                const englishVerses = data.data[1].ayahs;
                
                statusDiv.innerHTML = `✅ Сура ${surahNumber}: получено ${arabicVerses.length} аятов`;
                
                // Показываем первые несколько аятов
                displayVerses(arabicVerses, englishVerses);
                
                // Генерируем код
                generateCode(surahNumber, arabicVerses, englishVerses);
                
            } catch (error) {
                statusDiv.innerHTML = `❌ Ошибка: ${error.message}`;
                console.error(error);
            }
        }
        
        async function fetchAllSurahs() {
            statusDiv.innerHTML = '🔄 Загружаем все суры 1-10...';
            let allCode = '';
            
            for (let surahNum = 1; surahNum <= 10; surahNum++) {
                try {
                    statusDiv.innerHTML = `🔄 Загружаем суру ${surahNum}/10...`;
                    
                    const response = await fetch(`https://api.alquran.cloud/v1/surah/${surahNum}/editions/quran-uthmani,en.sahih`);
                    
                    if (!response.ok) {
                        throw new Error(`HTTP ${response.status}`);
                    }
                    
                    const data = await response.json();
                    
                    if (!data.data || data.data.length < 2) {
                        throw new Error('Неполные данные от API');
                    }
                    
                    const arabicVerses = data.data[0].ayahs;
                    const englishVerses = data.data[1].ayahs;
                    
                    const surahCode = generateSurahCode(surahNum, arabicVerses, englishVerses);
                    allCode += surahCode;
                    
                    // Пауза между запросами
                    await new Promise(resolve => setTimeout(resolve, 500));
                    
                } catch (error) {
                    console.error(`Ошибка при загрузке суры ${surahNum}:`, error);
                    allCode += `// Ошибка при загрузке суры ${surahNum}\n\n`;
                }
            }
            
            statusDiv.innerHTML = '✅ Все суры загружены!';
            outputTextarea.value = allCode;
        }
        
        function displayVerses(arabicVerses, englishVerses) {
            versesDiv.innerHTML = '<h3>Первые 5 аятов:</h3>';
            
            for (let i = 0; i < Math.min(5, arabicVerses.length); i++) {
                const verseDiv = document.createElement('div');
                verseDiv.className = 'verse';
                verseDiv.innerHTML = `
                    <div class="arabic">${arabicVerses[i].text}</div>
                    <div class="translation">${englishVerses[i]?.text || ''}</div>
                `;
                versesDiv.appendChild(verseDiv);
            }
        }
        
        function generateCode(surahNumber, arabicVerses, englishVerses) {
            const surahCode = generateSurahCode(surahNumber, arabicVerses, englishVerses);
            outputTextarea.value = surahCode;
        }
        
        function generateSurahCode(surahNumber, arabicVerses, englishVerses) {
            const info = surahInfo[surahNumber] || { name: `Сура ${surahNumber}`, englishName: `Surah ${surahNumber}`, verses: arabicVerses.length };
            
            let code = `// Сура ${surahNumber} - ${info.name} (${arabicVerses.length} аятов)\n`;
            code += `export const surah${surahNumber}: SurahData = {\n`;
            code += `  number: ${surahNumber},\n`;
            code += `  name: "${info.name}",\n`;
            code += `  englishName: "${info.englishName}",\n`;
            code += `  verses: ${arabicVerses.length},\n`;
            code += `  texts: [\n`;
            
            for (let i = 0; i < arabicVerses.length; i++) {
                const arabic = arabicVerses[i].text || '';
                const translation = englishVerses[i]?.text || '';
                
                const arabicEscaped = arabic.replace(/"/g, '\\"').trim();
                const translationEscaped = translation.replace(/"/g, '\\"').trim();
                
                code += `    { arabic: "${arabicEscaped}", translation: "${translationEscaped}" }`;
                if (i < arabicVerses.length - 1) {
                    code += ',';
                }
                code += '\n';
            }
            
            code += `  ]\n`;
            code += `};\n\n`;
            
            return code;
        }
        
        function copyToClipboard() {
            outputTextarea.select();
            document.execCommand('copy');
            alert('Код скопирован в буфер обмена!');
        }
        
        // Автоматически загружаем суру 2 при открытии страницы
        window.onload = function() {
            fetchSurah();
        };
    </script>
</body>
</html>
